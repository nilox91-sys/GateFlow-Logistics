version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sda_user
      POSTGRES_PASSWORD: sda_password
      POSTGRES_DB: logistic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sda_user -d logistic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sda_user:sda_password@db:5432/logistic_db
      - SECRET_KEY=super-secret-key-gateflow
      - ADMIN_PASSWORD=logistics2026
      - ALLOWED_ORIGINS=*
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
